[workspace]
name = "qe-project"
channels = ["conda-forge"]
platforms = ["osx-arm64"]          # add "linux-64" later for a CUDA machine

[feature.promptir.dependencies]
python = "3.10.*"
pytorch = "2.0.*"                  # same era as the checkpoint's Lightning 2.0
torchvision = "*"
lightning = "2.0.*"                # matches the version the checkpoint was saved with
numpy = "<2"                       # PyTorch 2.0 was built against NumPy 1.x
pillow = "*"
matplotlib = "*"
einops = "*"
tqdm = "*"
setuptools = "<70"      # Lightning 2.0 needs pkg_resources, which newer setuptools dropped

[feature.moce.dependencies]
opencv = "*"
scikit-image = "*"
scipy = "*"
fvcore = "*"
iopath = "*"
torchmetrics = "*"

[feature.dod.dependencies]
python = "3.10.*"
pytorch = "2.0.*"
torchvision = "0.15.*"
numpy = "1.26.*"
pillow = "*"
matplotlib = "*"
pyyaml = "*"
scipy = "*"
opencv = "*"
einops = "*"
tqdm = "*"
safetensors = "*"
accelerate = "*"
diffusers = "0.25.0"
transformers = "4.28.1"
huggingface_hub = "0.25.*"
peft = "0.13.0"
setuptools = "<70"

[feature.dod.pypi-dependencies]
basicsr = "==1.4.2"

[feature.r2r.dependencies]
scikit-learn = "*"
scikit-image = "*"
scipy = "*"
opencv = "*"
torchmetrics = "*"

[environments]
promptir = ["promptir"]
adair = ["promptir"]      # same dependencies; pixi shares the installed packages
moce = ["promptir", "moce"]   # PromptIR's dependencies + the extras above
dod = ["dod"]
r2r = ["promptir", "r2r"]
